== Relational DBMS (RDMS)
    keterhubungan antar datanya, misal database univ didalamnya ada tabel-tabel sprt mahasiswa, prodi, matkul dan masing2 tabel di hubungkan dgn relasi

    auto_increment -> jadi otomatis nambah 1 setiap record yang masuk
    record -> data satu mahasiswa (nim, nama, alamat)
    Primary key -> harus ada tiap tabel. sebuah data yang dapat merepresentasikan satu baris record secara unik, misal nim krn unik (pasti beda dgn yang lain)
